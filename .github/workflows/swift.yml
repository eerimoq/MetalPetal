name: Swift

on:
  push:
  pull_request:

jobs:
  various:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Source code styling
        run: |
          brew install swiftformat
          make style-check
      - name: Linting
        run: |
          brew install swiftlint
          make lint
      - name: Spell checking
        run: |
          brew install codespell
          make spell-check

  generated-sources:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check generated sources are up to date
      run: |
        brew install swiftformat
        make generate
        git diff --exit-code -- Sources || {
          echo "::error::Generated sources are out of date. Run 'make generate' and commit the result."
          exit 1
        }

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build
    - name: Run tests
      run: make test

  ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-ios

  ios-simulator:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-ios-simulator

  mac-catalyst:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-mac-catalyst
    - name: Test
      run: make test-mac-catalyst

  tvos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-tvos

  examples:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-examples
