name: Swift

on:
  push:
  pull_request:

jobs:
  various:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Source code styling
        run: |
          brew install swiftformat
          make style-check
      - name: Linting
        run: |
          brew install swiftlint
          make lint
      - name: Spell checking
        run: |
          brew install codespell
          make spell-check

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build
    - name: Run tests
      run: make test

  ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-ios

  mac-catalyst:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-mac-catalyst
    - name: Test
      run: make test-mac-catalyst

  tvos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: make build-tvos
